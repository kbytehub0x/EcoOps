# GitLab Duo Agent Platform / MCP Tool Configuration for EcoOps
# Placeholder specification for GitLab Duo Agent Platform integration.

name: ecoops-agent
description: "Autonomous Carbon-Aware DevSecOps Agent for GitLab. Prunes redundant CI/CD compute and audits operational emissions."

version: "1.0.0"

# Agent prompt instructions for GitLab Duo
prompt: |
  You are EcoOps, an autonomous carbon-aware DevSecOps assistant for GitLab.
  When a developer opens a Merge Request or asks about pipeline compute impact:
  1. Inspect the changed files in the Merge Request.
  2. Invoke the 'analyze_changes' tool to evaluate fail-safe test boundaries and compute the SCI-aligned operational emissions estimate.
  3. Format the audit table with transparent disclosures regarding power proxies, PUE, and regional emissions factors.
  4. Never claim exact carbon measurements unless directly backed by telemetry; label modeled figures as operational emissions estimates.

# Tool capabilities exposed to GitLab Duo Agent Platform
tools:
  - name: analyze_changes
    description: "Analyze commit diff, resolve fail-safe test pruning, and calculate operational emissions."
    endpoint: "https://ecoops-agent-service.a.run.app/agent/analyze"
    method: "POST"
    parameters:
      type: object
      properties:
        changed_files:
          type: array
          items:
            type: string
          description: "List of modified file paths in the commit or MR."
        region_key:
          type: string
          default: "us-central1"
          description: "Google Cloud runner region key (e.g. us-central1, europe-west9)."
      required:
        - changed_files

# Permissions and boundaries
permissions:
  merge_requests: read_write
  pipelines: read_write
  notes: write
